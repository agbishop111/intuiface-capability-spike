<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Capability Spike — Explore & Focus</title>
  <style>
    /* --- Base: kiosk-friendly typography and touch targets --- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      font-size: 18px;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
      background: #0f1419;
      color: #e8ecf1;
      line-height: 1.45;
    }

    /* Views: show/hide via .is-hidden (no routing) */
    .view {
      display: none;
      min-height: 100vh;
      padding: 1.25rem 1.25rem 2rem;
      max-width: 56rem;
      margin: 0 auto;
    }

    .view.is-active {
      display: block;
    }

    header.app-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #2a3441;
    }

    header.app-header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-height: 2.75rem;
      padding: 0 1.1rem;
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 0.65rem;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }

    .btn-primary:active {
      background: #2563eb;
    }

    .btn-ghost {
      background: #1e293b;
      color: #e8ecf1;
      border: 1px solid #334155;
    }

    .btn-ghost:active {
      background: #334155;
    }

    .btn-star {
      min-width: 3rem;
      min-height: 3rem;
      padding: 0;
      border-radius: 0.75rem;
      background: #1e293b;
      color: #94a3b8;
      border: 2px solid #334155;
      font-size: 1.35rem;
      line-height: 1;
    }

    .btn-star[aria-pressed="true"] {
      background: #422006;
      color: #fbbf24;
      border-color: #f59e0b;
    }

    /* Explore: card grid */
    .card-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 640px) {
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .cap-card {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1.1rem 1.15rem;
      background: #1a2332;
      border-radius: 0.85rem;
      border: 2px solid #2a3441;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .cap-card.is-selected {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #3b82f680;
    }

    .cap-card h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 650;
    }

    .cap-card p {
      margin: 0;
      flex: 1;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .cap-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .cap-card-footer .hint {
      font-size: 0.8rem;
      color: #64748b;
    }

    /* Focus map */
    .focus-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .focus-item {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.65rem;
      padding: 1rem 1.1rem;
      background: #1a2332;
      border-radius: 0.85rem;
      border: 1px solid #2a3441;
    }

    .focus-item .badge {
      flex-shrink: 0;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.35rem 0.55rem;
      border-radius: 0.4rem;
    }

    .badge-primary {
      background: #1e3a5f;
      color: #93c5fd;
    }

    .badge-supporting {
      background: #292524;
      color: #d6d3d1;
    }

    .focus-item h3 {
      margin: 0 0 0.35rem;
      font-size: 1.05rem;
      width: 100%;
    }

    .focus-item p {
      margin: 0;
      color: #94a3b8;
      font-size: 0.9rem;
      width: 100%;
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1.25rem;
      background: #1a2332;
      border-radius: 0.85rem;
      border: 1px dashed #334155;
      color: #94a3b8;
    }

    .empty-state strong {
      display: block;
      color: #e8ecf1;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    /* Session ID: subtle on explore, clearer on focus map */
    .session-hint {
      margin: -0.5rem 0 1.25rem;
      font-size: 0.8rem;
      color: #64748b;
      letter-spacing: 0.02em;
    }

    .session-hint strong {
      color: #94a3b8;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .focus-session-panel {
      margin-bottom: 1.15rem;
      padding: 0.65rem 1rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.65rem;
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    .focus-session-panel .session-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 0.25rem;
    }

    .focus-session-panel .session-id-value {
      font-size: 1.25rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      color: #f1f5f9;
    }

    /* Continue later + QR (Focus map) */
    .continue-later {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #2a3441;
    }

    .continue-later-heading {
      margin: 0 0 0.5rem;
      font-size: 1.1rem;
      font-weight: 650;
    }

    .continue-later-lede {
      margin: 0 0 1rem;
      color: #94a3b8;
      font-size: 0.95rem;
      max-width: 36rem;
    }

    .focus-qr-mount {
      display: inline-block;
      padding: 0.65rem;
      background: #fff;
      border-radius: 0.65rem;
      line-height: 0;
    }

    .focus-qr-mount img {
      display: block;
      width: 200px;
      height: 200px;
    }

    .qr-url-muted {
      margin: 0.85rem 0 0;
      font-size: 0.75rem;
      color: #64748b;
      word-break: break-all;
      max-width: 100%;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <!-- Explore: selectable capability cards -->
  <div id="view-explore" class="view is-active" aria-hidden="false">
    <header class="app-header">
      <h1>Explore capabilities</h1>
      <button type="button" class="btn btn-primary" id="btn-to-focus">
        View focus map
      </button>
    </header>
    <p style="margin: 0 0 1.25rem; color: #94a3b8; max-width: 40rem">
      Tap a star to select. Order matters: your first picks become primary when you open the focus map.
    </p>
    <p class="session-hint" id="explore-session-display" aria-label="Kiosk session identifier"></p>
    <div id="explore-card-host" class="card-grid" role="list"></div>
  </div>

  <!-- Focus map: summary of selections with primary / supporting labels -->
  <div id="view-focus" class="view" aria-hidden="true">
    <header class="app-header">
      <h1>Focus map</h1>
      <button type="button" class="btn btn-ghost" id="btn-back-explore">
        Back to explore
      </button>
    </header>
    <div class="focus-session-panel" id="focus-session-display" role="status" aria-live="polite"></div>
    <div id="focus-content-host"></div>
    <section class="continue-later" id="focus-continue-section" aria-labelledby="continue-later-heading">
      <h2 class="continue-later-heading" id="continue-later-heading">Continue later</h2>
      <p class="continue-later-lede">Scan to access this session outside the kiosk.</p>
      <div id="focus-qr-mount" class="focus-qr-mount" role="img" aria-label="QR code for session takeaway URL"></div>
      <p id="focus-qr-url-text" class="qr-url-muted"></p>
    </section>
  </div>

  <!-- Feasibility: load QR renderer from CDN; swap for inlined script later for offline kiosk packages. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    /* -------------------------------------------------------------------------- */
    /* Session logic                                                              */
    /* -------------------------------------------------------------------------- */

    /**
     * Human-readable session token (e.g. GRID-4827, AI-7392, MAP-1843).
     * Picks a short prefix and a 4-digit suffix; stable for this page only.
     */
    function generateSessionId() {
      var prefixes = ["GRID", "AI", "MAP"];
      var prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
      var n = Math.floor(1000 + Math.random() * 9000);
      return prefix + "-" + n;
    }

    /** Set once at load; same value for the full page lifetime (no localStorage). */
    var sessionId = generateSessionId();

    /* -------------------------------------------------------------------------- */
    /* QR logic                                                                   */
    /* (Isolated so the CDN dependency can be replaced with an inlined library.) */
    /* -------------------------------------------------------------------------- */

    /**
     * Full URL encoded into the QR code. Placeholder host for spike / future infra.
     */
    function getSessionTakeawayUrl() {
      return "https://example.invalid/session?sessionId=" + encodeURIComponent(sessionId);
    }

    function clearQrMount(containerEl) {
      while (containerEl.firstChild) {
        containerEl.removeChild(containerEl.firstChild);
      }
    }

    /**
     * Draws a QR for payloadText into containerEl using the global QRCode (qrcodejs).
     * Returns nothing; safe to call whenever sessionId-derived URL changes.
     */
    function mountQrCodeWithLibrary(containerEl, payloadText) {
      if (typeof QRCode === "undefined") {
        containerEl.textContent = "QR library not loaded (check network or CDN).";
        return;
      }
      clearQrMount(containerEl);
      new QRCode(containerEl, {
        text: payloadText,
        width: 200,
        height: 200,
        colorDark: "#0f1419",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    /** Syncs muted URL text + QR image to the current sessionId. */
    function refreshSessionQrDisplay() {
      var url = getSessionTakeawayUrl();
      var urlEl = document.getElementById("focus-qr-url-text");
      var mountEl = document.getElementById("focus-qr-mount");
      if (urlEl) {
        urlEl.textContent = url;
      }
      if (mountEl) {
        mountQrCodeWithLibrary(mountEl, url);
      }
    }

    /* -------------------------------------------------------------------------- */
    /* Rendering logic                                                            */
    /* -------------------------------------------------------------------------- */

    /**
     * Spike state: ordered selection IDs only (in-memory, no localStorage).
     * First selected = first in array; used for Primary vs Supporting labels.
     */
    var selectedCapabilities = [];

    function updateSessionIdDisplays() {
      var exploreEl = document.getElementById("explore-session-display");
      var focusEl = document.getElementById("focus-session-display");
      exploreEl.innerHTML = "Session <strong>" + sessionId + "</strong> · unchanged while this page is open";
      focusEl.innerHTML =
        '<span class="session-label">Session</span><span class="session-id-value">' + sessionId + "</span>";
    }

    /** Static catalog for the spike (6–8 items). */
    var CAPABILITIES = [
      { id: "summarize", title: "Summarize long content", description: "Turn documents or threads into short briefs with key points and actions." },
      { id: "draft", title: "Draft customer replies", description: "Generate on-brand email or chat responses from notes or bullet points." },
      { id: "classify", title: "Classify and route requests", description: "Label incoming items by intent, urgency, or team for faster triage." },
      { id: "extract", title: "Extract structured fields", description: "Pull names, dates, amounts, or IDs from unstructured text into a table." },
      { id: "compare", title: "Compare options", description: "Side-by-side pros, cons, and risks for policies, plans, or product choices." },
      { id: "coach", title: "Real-time agent coaching", description: "Suggest next-best questions, compliance phrases, or empathy cues during live chats." },
      { id: "search", title: "Semantic knowledge search", description: "Answer from internal docs with citations instead of keyword-only search." },
      { id: "monitor", title: "Monitor for anomalies", description: "Flag unusual patterns in logs, transactions, or operational metrics." }
    ];

    function capabilityById(id) {
      for (var i = 0; i < CAPABILITIES.length; i++) {
        if (CAPABILITIES[i].id === id) return CAPABILITIES[i];
      }
      return null;
    }

    function isSelected(id) {
      return selectedCapabilities.indexOf(id) !== -1;
    }

    /**
     * Toggle selection: append on select, remove on deselect; order preserved for primary logic.
     */
    function toggleSelection(capabilityId) {
      var idx = selectedCapabilities.indexOf(capabilityId);
      if (idx === -1) {
        selectedCapabilities.push(capabilityId);
      } else {
        selectedCapabilities.splice(idx, 1);
      }
      renderExploreView();
      if (document.getElementById("view-focus").classList.contains("is-active")) {
        renderFocusMapView();
      }
    }

    /** Show one main panel; others hidden (no router, no history API). */
    function showView(viewName) {
      var explore = document.getElementById("view-explore");
      var focus = document.getElementById("view-focus");
      if (viewName === "explore") {
        explore.classList.add("is-active");
        explore.setAttribute("aria-hidden", "false");
        focus.classList.remove("is-active");
        focus.setAttribute("aria-hidden", "true");
        renderExploreView();
      } else if (viewName === "focus") {
        focus.classList.add("is-active");
        focus.setAttribute("aria-hidden", "false");
        explore.classList.remove("is-active");
        explore.setAttribute("aria-hidden", "true");
        renderFocusMapView();
      }
    }

    function renderExploreView() {
      var host = document.getElementById("explore-card-host");
      host.innerHTML = "";
      for (var i = 0; i < CAPABILITIES.length; i++) {
        var cap = CAPABILITIES[i];
        var selected = isSelected(cap.id);
        var card = document.createElement("article");
        card.className = "cap-card" + (selected ? " is-selected" : "");
        card.setAttribute("role", "listitem");

        var h2 = document.createElement("h2");
        h2.textContent = cap.title;
        card.appendChild(h2);

        var p = document.createElement("p");
        p.textContent = cap.description;
        card.appendChild(p);

        var footer = document.createElement("div");
        footer.className = "cap-card-footer";

        var hint = document.createElement("span");
        hint.className = "hint";
        hint.textContent = selected ? "Selected" : "Not selected";
        footer.appendChild(hint);

        var star = document.createElement("button");
        star.type = "button";
        star.className = "btn btn-star";
        star.setAttribute("aria-label", (selected ? "Remove " : "Select ") + cap.title);
        star.setAttribute("aria-pressed", selected ? "true" : "false");
        star.textContent = "★";
        star.addEventListener("click", function (id) {
          return function () {
            toggleSelection(id);
          };
        }(cap.id));

        footer.appendChild(star);
        card.appendChild(footer);
        host.appendChild(card);
      }
    }

    function renderFocusMapView() {
      var host = document.getElementById("focus-content-host");
      host.innerHTML = "";

      if (selectedCapabilities.length === 0) {
        var empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML =
          "<strong>No capabilities selected yet</strong> " +
          "Go back to explore and tap the stars on the cards you care about. " +
          "Your first two selections will show as Primary on this map.";
        host.appendChild(empty);
        return;
      }

      var ul = document.createElement("ul");
      ul.className = "focus-list";

      for (var i = 0; i < selectedCapabilities.length; i++) {
        var id = selectedCapabilities[i];
        var cap = capabilityById(id);
        if (!cap) continue;

        var li = document.createElement("li");
        li.className = "focus-item";

        var badge = document.createElement("span");
        badge.className = "badge " + (i < 2 ? "badge-primary" : "badge-supporting");
        badge.textContent = i < 2 ? "Primary" : "Supporting";
        li.appendChild(badge);

        var h3 = document.createElement("h3");
        h3.textContent = cap.title;
        li.appendChild(h3);

        var p = document.createElement("p");
        p.textContent = cap.description;
        li.appendChild(p);

        ul.appendChild(li);
      }

      host.appendChild(ul);
    }

    document.getElementById("btn-to-focus").addEventListener("click", function () {
      showView("focus");
    });

    document.getElementById("btn-back-explore").addEventListener("click", function () {
      showView("explore");
    });

    updateSessionIdDisplays();
    refreshSessionQrDisplay();
    renderExploreView();
  </script>
</body>
</html>
