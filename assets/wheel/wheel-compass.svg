<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Wheel compass placeholder</title>
  <desc id="desc">Editable compass wheel placeholder with eight segment guides.</desc>
  <defs>
    <style>
      .ring{fill:none;stroke:currentColor;stroke-width:10;opacity:.9}
      .guide{stroke:currentColor;stroke-width:4;opacity:.28}
      .segment{fill:currentColor;opacity:.045}
      .tick{stroke:currentColor;stroke-width:6;stroke-linecap:round;opacity:.5}
      .label{font:600 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:currentColor;opacity:.75;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <circle class="segment" cx="320" cy="320" r="258"/>
  <circle class="ring" cx="320" cy="320" r="260"/>
  <circle class="ring" cx="320" cy="320" r="176" opacity=".45"/>
  <circle class="ring" cx="320" cy="320" r="82" opacity=".25"/>
  <line class="guide" x1="320" y1="60" x2="320" y2="580"/>
  <line class="guide" x1="60" y1="320" x2="580" y2="320"/>
  <line class="guide" x1="136" y1="136" x2="504" y2="504"/>
  <line class="guide" x1="504" y1="136" x2="136" y2="504"/>
  <line class="tick" x1="320" y1="36" x2="320" y2="76"/>
  <line class="tick" x1="320" y1="564" x2="320" y2="604"/>
  <line class="tick" x1="36" y1="320" x2="76" y2="320"/>
  <line class="tick" x1="564" y1="320" x2="604" y2="320"/>
  <polygon points="320,104 348,288 536,320 348,352 320,536 292,352 104,320 292,288" fill="currentColor" opacity=".08"/>
  <circle cx="320" cy="320" r="28" fill="currentColor" opacity=".85"/>
  <text class="label" x="320" y="36">N</text>
  <text class="label" x="604" y="320">E</text>
  <text class="label" x="320" y="604">S</text>
  <text class="label" x="36" y="320">W</text>
</svg>
